# Optional override for FUTURE sandbox isolation experiments.
# Requires Linux host with runsc registered as a Docker runtime.
#
# IMPORTANT: gVisor applies to *sandbox job containers*, not the supervisor.
# The supervisor must keep the default Docker runtime so it can talk to the engine.
#
# Usage (Linux only):
#   SANDBOX_DOCKER_RUNTIME=runsc docker compose -f compose.yaml -f compose.gvisor.yaml up
#
# Normal development does NOT need this file.
# See docs/GVISOR.md

services:
  runner:
    environment:
      # Central runtime selection for job containers created by the supervisor.
      SANDBOX_DOCKER_RUNTIME: ${SANDBOX_DOCKER_RUNTIME:-runsc}
    # Do NOT set runtime: runsc on the supervisor itself — it needs normal Docker access.
